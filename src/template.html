<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprintly</title>
  </head>
  <body>
    <aside id="sidebar">aside</aside>
    <main id="main">
      <header id="header">
        <button class="header__button">My Projects /</button>
      </header>
      <div id="content">
        <div class="project-title">
          <input
            type="text"
            id="myTodo"
            class="title-input"
            name="myTodo"
            value="My Todo"
            required
          />
        </div>

        <ul class="task-container">
          <div class="add-task">
            <button class="add-task__btn">
              <svg
                class="add-task-icon"
                width="24px"
                height="24px"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
                fill="#de4c4a"
              >
                <g id="SVGRepo_bgCarrier" stroke-width="0" />

                <g
                  id="SVGRepo_tracerCarrier"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

                <g id="SVGRepo_iconCarrier">
                  <path d="M6 12h6V6h1v6h6v1h-6v6h-1v-6H6z" />

                  <path fill="none" d="M0 0h24v24H0z" />
                </g>
              </svg>
              <p class="add-task__text">Add task</p>
            </button>

            <dialog class="add-task__popover">
              <form method="dialog" id="add-task__form">
                <div class="task-form__content">
                  <div class="task-form__text">
                    <input
                      type="text"
                      class="task-form__title"
                      placeholder="Title"
                      name="title"
                      required
                      autocomplete="off"
                    />
                    <input
                      type="text"
                      class="task-form__description"
                      placeholder="Description"
                      name="description"
                      autocomplete="off"
                    />
                  </div>

                  <div class="task-form__select">
                    <input type="date" class="task-form__date" name="date" />
                    <select
                      name="priority"
                      id="priority"
                      class="task-form__priority"
                    >
                      <option value="P1">Priority 1</option>
                      <option value="P2">Priority 2</option>
                      <option value="P3">Priority 3</option>
                      <option value="P4" selected>Priority 4</option>
                    </select>
                  </div>
                </div>

                <div class="task-form__footer">
                  <div class="task-form__options">
                    <button class="filled-button cancel-add-task">
                      Cancel
                    </button>
                    <button class="cta-button confirm-add-task">
                      Add task
                    </button>
                  </div>
                </div>
              </form>
            </dialog>
          </div>
        </ul>
      </div>
    </main>

    <!-- Task Item Modal Start -->
    <dialog class="task-item__modal">
      <div class="modal__header">
        <button class="modal__project-btn"># My Todo</button>
        <button class="modal__close-btn">
          <img class="close-icon" src="./assets/icons/close-icon.svg" alt="" />
        </button>
      </div>
      <div class="modal__content">
        <div class="modal__details">
          <form method="dialog" id="item-form">
            <div class="item-form__content">
              <label class="checkbox">
                <input type="checkbox" class="checkbox__input" />
              </label>
              <div class="item-form__text">
                <input
                  type="text"
                  class="item-form__title"
                  placeholder="Title"
                  name="title"
                  required=""
                  autocomplete="off"
                />
                <input
                  type="text"
                  class="item-form__description"
                  placeholder="Description"
                  name="description"
                  autocomplete="off"
                />
              </div>
            </div>
            <div class="item-form__actions">
              <button
                type="button"
                class="item-form__cancel button--large filled-button"
              >
                Cancel
              </button>
              <button class="item-form__save button--large cta-button">
                Save
              </button>
            </div>
          </form>
        </div>
        <div class="modal__options">
          <form method="dialog" id="optionsForm">
            <div class="options-group">
              <label for="optionDate" class="options-label">Date</label>
              <input
                type="date"
                id="optionDate"
                class="item-form__date item-form__input"
              />
            </div>
            <div class="options-group">
              <label for="optionPriority" class="options-label">Priority</label>
              <select
                name="priority"
                id="optionPriority"
                class="item-form__priority item-form__input"
              >
                <option value="P1">Priority 1</option>
                <option value="P2">Priority 2</option>
                <option value="P3">Priority 3</option>
                <option value="P4">Priority 4</option>
              </select>
            </div>
            <button type="button" class="options__delete">
              <img src="./assets/icons/delete-icon.svg" alt="" />
              Delete
            </button>
          </form>
        </div>
      </div>
    </dialog>
    <!-- Task Item Modal End -->
  </body>
</html>
