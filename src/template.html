<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprintly</title>
  </head>
  <body>
    <aside id="sidebar">aside</aside>
    <main id="main">
      <header id="header">
        <button class="header__button">My Projects /</button>
      </header>
      <div id="content">
        <div class="project-title">
          <input
            type="text"
            id="myTodo"
            class="title-input"
            name="myTodo"
            value="My Todo"
            required
          />
        </div>

        <ul class="task-container">
          <li class="task-item">
            <div class="task__details">
              <label class="task-checkbox">
                <input type="checkbox" class="checkbox__input" />
                <span class="checkbox__box"></span>
              </label>
              <p class="task__title">
                Add feature that will delete tasks from localStorage
              </p>
            </div>

            <div class="task__options">
              <button class="task__edit">
                <img
                  src="./assets/icons/edit-icon.svg"
                  alt=""
                  class="task-btn-img btn-icon"
                />
              </button>
            </div>
          </li>

          <li class="task-item">
            <div class="task__details">
              <label class="task-checkbox">
                <input type="checkbox" class="checkbox__input" />
                <span class="checkbox__box"></span>
              </label>
              <p class="task__title">Create add tasks form UI</p>
            </div>

            <div class="task__options">
              <button class="task__edit">
                <img
                  src="./assets/icons/edit-icon.svg"
                  alt=""
                  class="task-btn-img btn-icon"
                />
              </button>
            </div>
          </li>

          <li class="task-item">
            <div class="task__details">
              <label class="task-checkbox">
                <input type="checkbox" class="checkbox__input" />
                <span class="checkbox__box"></span>
              </label>
              <p class="task__title">
                Add feature that will add tasks to localStorage
              </p>
            </div>

            <div class="task__options">
              <button class="task__edit">
                <img
                  src="./assets/icons/edit-icon.svg"
                  alt=""
                  class="task-btn-img btn-icon"
                />
              </button>
            </div>
          </li>

          <div class="add-task">
            <button class="add-task__btn">
              <svg
                class="add-task-icon"
                width="24px"
                height="24px"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
                fill="#de4c4a"
              >
                <g id="SVGRepo_bgCarrier" stroke-width="0" />

                <g
                  id="SVGRepo_tracerCarrier"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

                <g id="SVGRepo_iconCarrier">
                  <path d="M6 12h6V6h1v6h6v1h-6v6h-1v-6H6z" />

                  <path fill="none" d="M0 0h24v24H0z" />
                </g>
              </svg>
              <p class="add-task__text">Add task</p>
            </button>

            <dialog class="add-task__popover">
              <form method="dialog" id="add-task__form">
                <div class="task-form__content">
                  <div class="task-form__text">
                    <input
                      type="text"
                      class="task-form__title"
                      placeholder="Title"
                      name="title"
                      required
                    />
                    <input
                      type="text"
                      class="task-form__description"
                      placeholder="Description"
                      name="description"
                    />
                  </div>

                  <div class="task-form__select">
                    <input type="date" class="task-form__date" name="date" />
                    <select
                      name="priority"
                      id="priority"
                      class="task-form__priority"
                    >
                      <option value="none" selected disabled hidden>
                        Priority
                      </option>
                      <option value="Priority 1">Priority 1</option>
                      <option value="Priority 2">Priority 2</option>
                      <option value="Priority 3">Priority 3</option>
                      <option value="Priority 4">Priority 4</option>
                    </select>
                  </div>
                </div>

                <div class="task-form__footer">
                  <div class="task-form__options">
                    <button class="filled-button cancel-add-task">
                      Cancel
                    </button>
                    <button class="cta-button confirm-add-task">
                      Add task
                    </button>
                  </div>
                </div>
              </form>
            </dialog>
          </div>
        </ul>
      </div>
    </main>

    <script>
      const addTaskBtn = document.querySelector(".add-task__btn");
      const addTaskPopover = document.querySelector(".add-task__popover");
      const confirmTask = document.querySelector(".confirm-add-task");
      const cancelTask = document.querySelector(".cancel-add-task");

      addTaskBtn.addEventListener("click", () => {
        addTaskPopover.show();
      });

      confirmTask.addEventListener("click", (e) => {
        // TODO: add logic for sending form data
      });

      cancelTask.addEventListener("click", (e) => {
        e.preventDefault();
        addTaskPopover.close();
      });
    </script>
  </body>
</html>
