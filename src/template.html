<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprintly</title>
  </head>
  <body>
    <aside id="sidebar">
      <button id="sidebar__add-task" class="sidebar__btn">
        <svg
          width="30px"
          height="30px"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g
            id="SVGRepo_tracerCarrier"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></g>
          <g id="SVGRepo_iconCarrier">
            <path
              d="M6 12H18M12 6V18"
              stroke="var(--color-secondary)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
          </g>
        </svg>
        <p>Add task</p>
      </button>

      <div
        id="projects-btn"
        class="sidebar__btn page-button"
        data-button="projects"
      >
        My Projects
        <button class="projects__add">
          <svg
            class="projects__icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            fill="var(--color-outline)"
          >
            <g id="SVGRepo_bgCarrier" stroke-width="0" />

            <g
              id="SVGRepo_tracerCarrier"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <g id="SVGRepo_iconCarrier">
              <path d="M6 12h6V6h1v6h6v1h-6v6h-1v-6H6z" />

              <path fill="none" d="M0 0h24v24H0z" />
            </g>
          </svg>
        </button>
      </div>
      <ul class="project-list"></ul>
    </aside>
    <main id="main">
      <header id="header">
        <button class="header__button">My Projects /</button>
      </header>
      <div id="content"></div>
    </main>

    <!-- Task Item Modal Start -->
    <dialog class="task-item__modal">
      <div class="modal__header">
        <button class="modal__project-btn"># My Todo</button>
        <button class="modal__close-btn">
          <img class="close-icon" src="./assets/icons/close-icon.svg" alt="" />
        </button>
      </div>
      <div class="modal__content">
        <div class="modal__details">
          <form method="dialog" id="item-form">
            <div class="item-form__content">
              <label class="checkbox">
                <input type="checkbox" class="checkbox__input" />
              </label>
              <div class="item-form__text">
                <input
                  type="text"
                  class="item-form__title"
                  placeholder="Title"
                  name="title"
                  required=""
                  autocomplete="off"
                />
                <input
                  type="text"
                  class="item-form__description"
                  placeholder="Description"
                  name="description"
                  autocomplete="off"
                />
              </div>
            </div>
            <div class="item-form__actions">
              <button
                type="button"
                class="item-form__cancel button--large filled-button"
              >
                Cancel
              </button>
              <button class="item-form__save button--large cta-button">
                Save
              </button>
            </div>
          </form>
        </div>
        <div class="modal__options">
          <form method="dialog" id="optionsForm">
            <div class="options-group">
              <label for="optionDate" class="options-label">Date</label>
              <input
                type="date"
                id="optionDate"
                class="item-form__date item-form__input"
              />
            </div>
            <div class="options-group">
              <label for="optionPriority" class="options-label">Priority</label>
              <select
                name="priority"
                id="optionPriority"
                class="item-form__priority item-form__input"
              >
                <option value="P1">Priority 1</option>
                <option value="P2">Priority 2</option>
                <option value="P3">Priority 3</option>
                <option value="P4">Priority 4</option>
              </select>
            </div>
            <button type="button" class="options__delete">
              <img src="./assets/icons/delete-icon.svg" alt="" />
              Delete
            </button>
          </form>
        </div>
      </div>
    </dialog>
    <!-- Task Item Modal End -->

    <!-- Projects Modal Start -->
    <dialog class="projects-modal">
      <div class="projects__header">
        <p class="projects__title">Add project</p>
        <button class="modal__close-btn projects__close-btn">
          <img class="close-icon" src="./assets/icons/close-icon.svg" alt="" />
        </button>
      </div>

      <form method="dialog" id="projects-form">
        <div class="projects-form__text">
          <label for="projectName" class="projects-form__label"
            >Project name</label
          >
          <input
            type="text"
            id="projectName"
            class="project-name"
            name="projectTitle"
            required
            autocomplete="off"
          />
        </div>
      </form>
      <div class="projects__footer">
        <button
          type="button"
          class="projects__cancel button--large filled-button"
        >
          Cancel
        </button>
        <button class="projects__add-btn cta-button" form="projects-form">
          Add
        </button>
      </div>
    </dialog>
    <!-- Projects Modal End -->
  </body>
</html>
