<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprintly</title>
  </head>
  <body>
    <aside id="sidebar">aside</aside>
    <main id="main">
      <header id="header">
        <button class="header__button">My Projects /</button>
      </header>
      <div id="content">
        <div class="project-title">
          <input
            type="text"
            id="myTodo"
            class="title-input"
            name="myTodo"
            value="My Todo"
            required
          />
        </div>

        <ul class="task-container">
          <div class="add-task">
            <button class="add-task__btn">
              <svg
                class="add-task-icon"
                width="24px"
                height="24px"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
                fill="#de4c4a"
              >
                <g id="SVGRepo_bgCarrier" stroke-width="0" />

                <g
                  id="SVGRepo_tracerCarrier"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

                <g id="SVGRepo_iconCarrier">
                  <path d="M6 12h6V6h1v6h6v1h-6v6h-1v-6H6z" />

                  <path fill="none" d="M0 0h24v24H0z" />
                </g>
              </svg>
              <p class="add-task__text">Add task</p>
            </button>

            <dialog class="add-task__popover">
              <form method="dialog" id="add-task__form">
                <div class="task-form__content">
                  <div class="task-form__text">
                    <input
                      type="text"
                      class="task-form__title"
                      placeholder="Title"
                      name="title"
                      required
                      autocomplete="off"
                    />
                    <input
                      type="text"
                      class="task-form__description"
                      placeholder="Description"
                      name="description"
                      autocomplete="off"
                    />
                  </div>

                  <div class="task-form__select">
                    <input type="date" class="task-form__date" name="date" />
                    <select
                      name="priority"
                      id="priority"
                      class="task-form__priority"
                    >
                      <option value="P1" selected>Priority 1</option>
                      <option value="P2">Priority 2</option>
                      <option value="P3">Priority 3</option>
                      <option value="P4">Priority 4</option>
                    </select>
                  </div>
                </div>

                <div class="task-form__footer">
                  <div class="task-form__options">
                    <button class="filled-button cancel-add-task">
                      Cancel
                    </button>
                    <button class="cta-button confirm-add-task">
                      Add task
                    </button>
                  </div>
                </div>
              </form>
            </dialog>
          </div>
        </ul>
      </div>
    </main>
  </body>
</html>
